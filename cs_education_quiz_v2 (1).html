<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 教育知識搶答王</title>
<style>
/* ===== 基礎色彩與字體 ===== */
:root{--bg:#0B132B;--red:#E63946;--gold:#FFD700;--grn:#2ECC71}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:#fff;font-family:Impact,Montserrat,"Microsoft JhengHei","PingFang TC",sans-serif;font-weight:900;display:flex;align-items:center;justify-content:center;padding:14px 14px 64px;overflow-x:hidden}

/* ===== 舞台：聚光燈 + 地板反光 ===== */
body::before{content:"";position:fixed;inset:-5%;z-index:0;pointer-events:none;
background:radial-gradient(ellipse 35% 80% at 18% -5%,rgba(255,215,0,.4),transparent 70%),radial-gradient(ellipse 35% 80% at 82% -5%,rgba(230,57,70,.4),transparent 70%),radial-gradient(ellipse 25% 60% at 50% -10%,rgba(255,255,255,.12),transparent 70%);animation:sway 7s ease-in-out infinite alternate}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:38%;z-index:0;pointer-events:none;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 60px),linear-gradient(transparent,rgba(70,100,220,.35))}
@keyframes sway{to{transform:translateX(26px) scale(1.06);opacity:.8}}

/* ===== 節目頂部：ON AIR / 隊名 / 分數 / 倒計時 / 連擊 ===== */
#game{position:relative;z-index:1;width:min(800px,100%)}
.hide{visibility:hidden}
#top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.live{background:var(--red);padding:4px 12px;border-radius:6px;font-size:15px;letter-spacing:2px;display:flex;align-items:center;gap:6px}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;animation:blink .8s infinite}
#team{flex:1;color:var(--gold);font-size:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stat{font-size:13px;color:#aab4e0;text-align:center}
.stat b{display:block;font-size:28px;color:var(--gold)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--gold)) var(--p,360deg),#26325e 0)}
.ring span{width:68px;height:68px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:30px;color:var(--c,var(--gold))}
.ring.danger{--c:var(--red);animation:heartbeat .6s infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}30%{transform:scale(1.18);box-shadow:0 0 28px var(--red)}60%{transform:scale(1.04)}}
@keyframes blink{50%{opacity:.25}}

/* ===== 題數進度燈 ===== */
#lad{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.dot{width:34px;height:10px;border-radius:5px;background:#26325e;transition:.3s}
.dot.on{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.dot.ok{background:var(--grn)}.dot.no{background:var(--red)}

/* ===== 題目卡片：電視燈泡邊框 + 轉場 ===== */
#stage{position:relative}
.card{background:rgba(14,24,60,.82);border:7px dotted var(--gold);border-radius:22px;padding:22px 24px;box-shadow:0 0 40px rgba(255,215,0,.25),0 12px 40px rgba(0,0,0,.6)}
.card.in{animation:inUp .5s ease both,bulb 1s steps(1) infinite}
.card.out{animation:outUp .45s ease both,bulb 1s steps(1) infinite}
@keyframes bulb{50%{border-color:var(--red)}}
@keyframes inUp{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
@keyframes outUp{to{opacity:0;transform:translateY(-80px)}}
.tag{display:inline-block;background:var(--red);padding:3px 14px;border-radius:20px;font-size:15px}
.host{margin:10px 0;padding:8px 14px;background:rgba(255,215,0,.12);border-left:5px solid var(--gold);border-radius:0 10px 10px 0;color:#ffe98a;font-size:17px}
h1{font-size:clamp(30px,7vw,54px);color:var(--gold);text-shadow:0 0 24px rgba(255,215,0,.7),3px 3px 0 var(--red)}
h2{font-size:clamp(20px,3.6vw,27px);line-height:1.5;margin-bottom:10px}
.sub{color:#aab4e0;margin:12px 0 18px;font-size:18px;line-height:1.6}

/* ===== 選項：競答橢圓框，懸停霓虹、點擊按壓 ===== */
.opt{display:flex;align-items:center;gap:14px;width:100%;margin:9px 0;padding:12px 20px;font:inherit;font-size:20px;color:#fff;text-align:left;background:#14204a;border:2px solid #4a5aa0;border-radius:50px;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s,opacity .3s}
.opt b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-size:18px}
.opt:hover{transform:scale(1.05);border-color:var(--gold);box-shadow:0 0 18px var(--gold),0 0 44px rgba(255,215,0,.55)}
.opt:active{transform:scale(.95)}
.opt.lk{background:#c77d00;border-color:var(--gold);animation:lock .35s infinite}
@keyframes lock{50%{background:#ffb703;box-shadow:0 0 28px var(--gold)}}
.opt.ok{background:var(--grn);border-color:var(--grn);color:#062b14;animation:ripple .9s}
.opt.bad{background:var(--red);border-color:var(--red)}
.opt.dim{opacity:.35}.opt.gone{visibility:hidden}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(46,204,113,.95)}100%{box-shadow:0 0 0 46px rgba(46,204,113,0)}}
.lock{pointer-events:none}.lock .fb{pointer-events:auto}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfrow .opt{justify-content:center;font-size:26px}

/* ===== 配對題 ===== */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.mgrid .opt{margin:0;font-size:16px;padding:12px;border-radius:16px;justify-content:center;text-align:center}
.opt.sel{border-color:var(--gold);background:#2a3a7a;box-shadow:0 0 16px var(--gold)}
.opt.done{background:var(--grn);border-color:var(--grn);color:#062b14;pointer-events:none}
.opt.wrong{background:var(--red);border-color:var(--red);animation:shake .4s}

/* ===== 求助錦囊 ===== */
#life{display:flex;justify-content:center;gap:16px;margin-top:14px}
.ll{font:inherit;font-size:16px;width:92px;height:44px;border-radius:50%/50%;color:var(--gold);background:#14204a;border:3px solid var(--gold);cursor:pointer;transition:.18s}
.ll:hover{transform:scale(1.08);box-shadow:0 0 18px var(--gold)}.ll:active{transform:scale(.93)}
.ll.used{opacity:.3;text-decoration:line-through;pointer-events:none}

/* ===== 按鈕與解析 ===== */
.btn{font:inherit;font-size:20px;padding:12px 30px;color:#fff;background:var(--red);border:none;border-radius:40px;cursor:pointer;transition:.18s}
.btn:hover{transform:scale(1.05);box-shadow:0 0 22px var(--red)}.btn:active{transform:scale(.95)}
.fb{margin-top:12px;font-size:18px;line-height:1.6}
.fb .g{color:var(--grn);font-size:24px}.fb .r{color:#ff6b78;font-size:24px}
.fb .btn{margin-top:10px}
.big{font-size:72px;color:var(--gold);line-height:1.1;text-shadow:0 0 24px var(--gold)}

/* ===== 特效：震動 / COMBO / 倒數 / 閃光 / 彩帶 ===== */
#game.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-18px)}30%{transform:translateX(16px)}45%{transform:translateX(-14px)}60%{transform:translateX(12px)}75%{transform:translateX(-7px)}90%{transform:translateX(5px)}}
#combo,#cd{position:fixed;left:50%;top:42%;translate:-50% -50%;z-index:20;pointer-events:none;opacity:0;white-space:nowrap;color:var(--gold);text-shadow:0 0 30px var(--red),4px 4px 0 var(--red)}
#combo{font-size:clamp(56px,14vw,130px)}#cd{font-size:clamp(100px,26vw,240px)}
.go{animation:pop 1.1s ease}
#cd.go{animation:pop .8s ease}
@keyframes pop{0%{opacity:0;transform:scale(0) rotate(-8deg)}25%{opacity:1;transform:scale(1.4) rotate(3deg)}45%{transform:scale(.9)}65%{transform:scale(1.12)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
#flash{position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%)}
#flash.go{animation:fl .5s}@keyframes fl{20%{opacity:1}100%{opacity:0}}
.cf{position:fixed;top:-24px;z-index:15;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.7}}

/* ===== 底部新聞跑馬燈 + 靜音鍵 ===== */
#tick{position:fixed;left:0;right:0;bottom:0;height:42px;z-index:5;display:flex;background:rgba(0,0,0,.8);border-top:3px solid var(--gold)}
#tick i{font-style:normal;background:var(--red);padding:0 16px;display:grid;place-items:center;z-index:1}
#tick div{flex:1;overflow:hidden;display:flex;align-items:center}
#tick span{white-space:nowrap;padding-left:100%;font-size:16px;color:#ffe98a;animation:mq 34s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#mute{position:fixed;top:10px;right:10px;z-index:30;font-size:22px;background:none;border:none;cursor:pointer}
/* ===== 終場畫面 ===== */
.end{text-align:center}
.drum{font-size:34px;color:var(--gold);padding:80px 0;animation:blink .4s infinite}
.trophy{position:relative;height:140px;display:grid;place-items:center}
.trophy i{position:absolute;width:270px;height:270px;border-radius:50%;background:repeating-conic-gradient(rgba(255,215,0,.3) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 15%,transparent 68%);mask:radial-gradient(circle,#000 15%,transparent 68%);animation:spin 8s linear infinite}
.trophy em{font-style:normal;font-size:88px;position:relative;animation:drop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{from{transform:scale(0) translateY(-140px)}to{transform:none}}
.rk{margin:4px 0 0;color:var(--gold);font-size:clamp(28px,6vw,44px);text-shadow:0 0 24px var(--gold),3px 3px 0 var(--red)}
.big{font-size:64px}.pts{font-size:14px;color:#aab4e0}
.chips{display:flex;gap:10px;justify-content:center;margin:12px 0}
.chips div{flex:1;max-width:170px;background:rgba(255,255,255,.07);border:2px solid rgba(255,215,0,.4);border-radius:14px;padding:8px;font-size:13px;color:#aab4e0}
.chips b{display:block;font-size:26px;color:var(--gold)}
.rdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.rdots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.rdots .ok{background:var(--grn);color:#062b14}.rdots .no{background:var(--red)}
.recap{text-align:left;background:rgba(255,215,0,.08);border-left:5px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 16px;margin-bottom:14px;font-size:16px;line-height:1.7}
.recap h3{color:var(--gold);font-size:18px}.recap p{animation:inUp .5s both}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
</style>
</head>
<body>
<button id="mute" title="音效開關">🔊</button>
<div id="game">
  <div id="hud" class="hide">
    <div id="top">
      <div class="live">ON AIR</div><div id="team"></div>
      <div class="stat">分數<b id="sc">0</b></div>
      <div class="ring" id="ring"><span id="tt">15</span></div>
      <div class="stat">連擊<b id="st">0</b></div>
    </div>
    <div id="lad"></div>
  </div>
  <div id="stage"></div>
  <div id="life" class="hide"><button class="ll" id="lf">50:50</button><button class="ll" id="lt">+10秒</button></div>
</div>
<div id="combo"></div><div id="cd"></div><div id="flash"></div>
<div id="tick"><i>CS 速遞</i><div><span>九年義務教育重視公平性與均衡發展　◆　高等教育已踏入大眾化階段，大學招生數目增加　◆　中國擁有世界規模最大的職業教育體系，提供實用型技術人才　◆　改革開放後，愈來愈多學生出國留學，以增廣見聞　◆　各類教育的普及率及程度都有明顯提高</span></div></div>

<script>
/* ===== 題庫（只涵蓋教育）：mc 單選 / tf 判斷 / match 配對 ===== */
const Q=[
 {t:'mc',type:'單選題',q:'中國實施九年義務教育以來，最重視教育的哪一方面？',o:['精英化','公平性與均衡發展','出國留學','職業技能'],a:1,e:'學習單指出，重視教育的公平性和均衡發展。'},
 {t:'mc',type:'單選題',q:'目前中國的高等教育已經踏入哪一個階段？',o:['精英化','大眾化','貴族化','停滯'],a:1,e:'中國持續發展高等教育，踏入大眾化階段。'},
 {t:'mc',type:'單選題',q:'目前中國擁有世界規模最大的哪一種教育體系？',o:['高等教育','義務教育','職業教育','國際留學'],a:2,e:'擁有世界規模最大的職業教育體系，提供實用型技術人才。'},
 {t:'mc',type:'單選題',q:'中國實施九年義務教育，除了重視教育的公平性，還特別強調下列哪一項發展？',o:['貴族化發展','均衡發展','國際化發展','軍事化發展'],a:1,e:'學習單指出，中國實施九年義務教育以來，重視教育的公平性和「均衡發展」。'},
 {t:'mc',type:'單選題',q:'中國的高等教育踏入「大眾化」階段後，帶來了什麼最直接的結果？',o:['大學學費全面免費','大學招生數目增加','出國留學生人數減少','職業學校倒閉'],a:1,e:'學習單指出，高等教育踏入大眾化階段，最直接的結果就是「大學招生數目增加」。'},
 {t:'mc',type:'單選題',q:'中國的職業教育體系主要為各行各業提供哪一類的人才？',o:['理論研究型人才','實用型技術人才','政策制定型人才','出國留學型人才'],a:1,e:'學習單指出，職業導向的實用技能為各行各業提供了大批「技術人才」（實用型技能人才）。'},
 {t:'mc',type:'單選題',q:'近年來，中國學生到國外留學的趨勢為何？',o:['人數愈來愈少','僅限於頂尖大學生','人數愈來愈多，以增廣見聞','國家禁止學生出國'],a:2,e:'學習單指出，愈來愈多學生到國外留學，以「增廣見聞」。'},
 {t:'tf',type:'判斷題',q:'改革開放後，愈來愈多中國學生選擇到國外留學，主要目的是為了增廣見聞。',o:['✔ 正確','✘ 錯誤'],a:0,e:'學習單明確指出留學是為了增廣見聞。'},
 {t:'tf',type:'判斷題',q:'中國的高等教育目前仍嚴格限制招生，處於「精英化」階段。',o:['✔ 正確','✘ 錯誤'],a:1,e:'已踏入「大眾化」階段，大學招生數目增加。'},
 {t:'tf',type:'判斷題',q:'中國實施九年義務教育後，各類教育的普及率及程度都有明顯提高。',o:['✔ 正確','✘ 錯誤'],a:0,e:'學習單指出各類教育普及率及程度明顯提高。'},
 {t:'match',type:'配對題',time:30,q:'請將「教育發展項目」與「描述」配對（先點左，再點右）',
  L:['九年義務教育','高等教育','出國留學','職業教育'],
  R:['重視公平性與均衡發展','踏入大眾化階段，招生數目增加','人數愈來愈多，以增廣見聞為目的','規模最大，提供實用型技術人才'],
  e:'九年義務教育重公平與均衡；高等教育已大眾化；留學為增廣見聞；職業教育規模世界最大。'}
];
/* 主持人台詞 */
const H={q:['請看題目，15 秒倒數開始！','集中精神，觀眾都在看著你！','這題可不簡單喔！','準備好了嗎？'],lock:['你確定嗎？','這是你的最終答案？','鎖定答案……','氣氛緊張起來了！'],ok:['答對了！掌聲送給你們！','完全正確！','漂亮！太厲害了！'],bad:['好可惜……','不要氣餒，看看解析！','答案不是這個喔']};
const pick=a=>a[Math.random()*a.length|0];

/* ===== 工具 ===== */
const $=s=>document.querySelector(s),stage=$('#stage'),game=$('#game'),ring=$('#ring');
let idx,score,streak,best,right,locked,busy,cur,tm,left,total,res,used,lastSec,mute=false,AC;
const el=(t,c,h)=>{const d=document.createElement(t);if(c)d.className=c;if(h!=null)d.innerHTML=h;return d};
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const rs=(n,c)=>{n.classList.remove(c);void n.offsetWidth;n.classList.add(c)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const say=t=>{const s=$('#hs');if(s)s.textContent=t};

/* ===== 音效：WebAudio 合成，無需任何音檔 ===== */
function snd(seq,type='sine',g=.15){
  if(mute)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;
  seq.forEach(([f,t,d])=>{const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;
    v.gain.setValueAtTime(g,n+t);v.gain.exponentialRampToValueAtTime(.001,n+t+d);o.connect(v);v.connect(AC.destination);o.start(n+t);o.stop(n+t+d)});
}
$('#mute').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊'};

/* ===== HUD 與進度燈 ===== */
function hud(){
  $('#sc').textContent=score;$('#st').textContent=streak;
  $('#lad').innerHTML=Q.map((_,i)=>`<div class="dot ${res[i]===true?'ok':res[i]===false?'no':i===idx?'on':''}"></div>`).join('');
  $('#lf').classList.toggle('used',used.f);$('#lt').classList.toggle('used',used.t);
}
function setHud(on){['#hud','#life'].forEach(s=>$(s).classList.toggle('hide',!on))}

/* ===== 開場畫面 ===== */
function intro(){
  setHud(false);
  const c=el('div','card in',`<span class="tag">LIVE 直播</span><h1>CS 教育知識搶答王</h1>
  <p class="sub">改革開放後中國教育事業的發展<br>共 ${Q.length} 題・每題 15 秒・連對有 COMBO・2 個求助錦囊</p>`);
  const b=el('button','btn','開始節目');b.onclick=start;c.append(b);stage.replaceChildren(c);
}
/* 3-2-1 倒數後開播 */
async function start(){
  $('#team').textContent='CS 教育知識搶答王';
  idx=0;score=0;streak=0;best=0;right=0;res=[];used={f:false,t:false};hud();setHud(true);stage.replaceChildren();
  for(const n of['3','2','1','GO!']){const c=$('#cd');c.textContent=n;rs(c,'go');snd([[n==='GO!'?880:440,0,.25]],'square',.1);await sleep(800)}
  show();
}

/* ===== 出題 ===== */
function show(){
  const q=Q[idx];locked=busy=false;lastSec=0;hud();
  const c=el('div','card in',`<span class="tag">第 ${idx+1} 題・${q.type}</span><div class="host">🎤 <span id="hs"></span></div><h2>${q.q}</h2><div class="body"></div><div class="fb"></div>`);
  const body=c.querySelector('.body');
  if(q.t==='match')buildMatch(q,body);
  else{
    if(q.t==='tf')body.className='body tfrow';
    q.o.forEach((txt,i)=>{const b=el('button','opt',(q.t==='mc'?`<b>${'ABCD'[i]}</b>`:'')+txt);b.onclick=()=>choose(i,b);body.append(b)});
  }
  cur=c;stage.replaceChildren(c);say(pick(H.q));startTimer(q.time||15);
}

/* 選擇 → 鎖定答案懸疑 1.3 秒 → 揭曉 */
function choose(i,b){
  if(locked||busy)return;busy=true;clearInterval(tm);ring.classList.remove('danger');
  cur.querySelectorAll('.opt').forEach(o=>o!==b&&o.classList.add('dim'));b.classList.add('lk');
  say(pick(H.lock));snd([[196,0,.5],[196,.6,.5]],'triangle',.2);
  setTimeout(()=>{b.classList.remove('lk','dim');const ok=i===Q[idx].a;b.classList.add(ok?'ok':'bad');finish(ok)},1300);
}

/* 配對題：點左再點右 */
function buildMatch(q,body){
  const g=el('div','mgrid');let sel=null,done=0,miss=0;
  const L=q.L.map((t,i)=>{const b=el('button','opt',t);b.dataset.i=i;return b});
  const R=shuffle(q.R.map((t,i)=>{const b=el('button','opt',t);b.dataset.i=i;return b}));
  L.forEach((l,k)=>g.append(l,R[k]));
  L.forEach(l=>l.onclick=()=>{if(l.classList.contains('done'))return;L.forEach(x=>x.classList.remove('sel'));sel=l;l.classList.add('sel')});
  R.forEach(r=>r.onclick=()=>{
    if(!sel||r.classList.contains('done'))return;const l=sel;sel=null;l.classList.remove('sel');
    if(l.dataset.i===r.dataset.i){ // 正確：雙雙變綠鎖定
      l.classList.add('done');r.classList.add('done');snd([[660,0,.2],[880,.12,.25]]);
      if(++done===q.L.length)finish(miss===0,'配對過程出現失誤，未能全對！');
    }else{ // 錯誤：雙雙變紅震動並重置
      miss++;snd([[140,0,.3]],'sawtooth',.12);[l,r].forEach(x=>x.classList.add('wrong'));
      setTimeout(()=>[l,r].forEach(x=>x.classList.remove('wrong')),450);
    }});
  body.append(g);
}

/* ===== 環形倒計時 ===== */
function startTimer(s){total=left=s;clearInterval(tm);tick();tm=setInterval(()=>{left-=.1;tick();if(left<=0)finish(false,'⏰ 時間到！')},100)}
function tick(){
  ring.style.setProperty('--p',Math.max(left/total,0)*360+'deg');$('#tt').textContent=Math.ceil(Math.max(left,0));
  const d=left<=5&&left>0;ring.classList.toggle('danger',d);
  if(d&&Math.ceil(left)!==lastSec){lastSec=Math.ceil(left);snd([[900,0,.08]],'square',.06)} // 最後5秒滴答聲
}

/* ===== 求助錦囊 ===== */
$('#lf').onclick=()=>{ // 刪去兩個錯誤選項（僅限單選題）
  const q=Q[idx];if(!cur||locked||busy||used.f||q.t!=='mc')return;used.f=true;
  const w=shuffle([0,1,2,3].filter(i=>i!==q.a)).slice(0,2),os=cur.querySelectorAll('.opt');
  w.forEach(i=>os[i].classList.add('gone'));say('刪去兩個錯誤選項！');snd([[500,0,.15],[700,.15,.2]]);hud();
};
$('#lt').onclick=()=>{ // 延長 10 秒
  if(!cur||locked||busy||used.t)return;used.t=true;total+=10;left+=10;say('時間延長 10 秒！');snd([[600,0,.15],[900,.15,.25]]);hud();
};

/* ===== 揭曉結果 ===== */
function finish(ok,msg){
  if(locked)return;locked=true;busy=true;clearInterval(tm);ring.classList.remove('danger');
  const q=Q[idx];cur.classList.add('lock');res[idx]=ok;
  if(q.t==='mc'||q.t==='tf')cur.querySelectorAll('.opt')[q.a].classList.add('ok');
  if(ok){
    streak++;right++;best=Math.max(best,streak);score+=100+Math.round(Math.max(left,0))*2+(streak>=2?streak*10:0);
    confetti(70);rs($('#flash'),'go');snd([[523,0,.2],[659,.15,.2],[784,.3,.35]],'triangle',.2);say(pick(H.ok));
    if(streak>=2){const c=$('#combo');c.textContent='COMBO x'+streak+'!';rs(c,'go');snd([[1047,.4,.3]],'square',.08)}
  }else{streak=0;rs(game,'shake');snd([[150,0,.5]],'sawtooth',.2);say(pick(H.bad))}
  hud();
  const fb=cur.querySelector('.fb');
  fb.innerHTML=`<p class="${ok?'g':'r'}">${ok?'✔ 答對了！':'✘ '+(msg||'答錯了！')}</p><p>解析：${q.e}</p>`;
  const nb=el('button','btn',idx===Q.length-1?'查看成績':'下一題');nb.onclick=next;fb.append(nb);
}

/* 轉場：舊題向上飛出，新題由下滑入 */
function next(){cur.classList.replace('in','out');setTimeout(()=>{idx++;idx<Q.length?show():result()},450)}

/* ===== 終場：鼓聲倒數 → 揭曉獎座、分數滾動、回顧重點 ===== */
function result(){
  idx=Q.length;setHud(false);
  const r=right/Q.length,pct=Math.round(r*100);
  const rk=r>=.9?['🏆','教育知識王']:r>=.7?['🥇','競答高手']:r>=.5?['🥈','潛力新星']:['🥉','再接再厲'];
  const c=el('div','card in end','<div class="drum">成績結算中……</div>');stage.replaceChildren(c);
  snd(Array.from({length:14},(_,i)=>[110+i*8,i*.12,.1]),'square',.08); // 鼓聲
  setTimeout(()=>{
    const pts=['九年義務教育：重視公平性與均衡發展','高等教育：已踏入大眾化階段，招生數目增加','職業教育：規模世界最大，提供實用型技術人才','出國留學：人數愈來愈多，以增廣見聞'];
    c.innerHTML=`<span class="tag">節目結束・最終成績</span>
    <div class="trophy"><i></i><em>${rk[0]}</em></div><h2 class="rk">${rk[1]}</h2>
    <div class="big" id="cnt">0</div><div class="pts">總得分</div>
    <div class="chips"><div><b>${right}/${Q.length}</b>答對題數</div><div><b>${pct}%</b>正確率</div><div><b>x${best}</b>最高連擊</div></div>
    <div class="rdots">${res.map((v,i)=>`<span class="${v?'ok':'no'}">${i+1}</span>`).join('')}</div>
    <div class="recap"><h3>本節目重點回顧</h3>${pts.map((t,i)=>`<p style="animation-delay:${1.2+i*.35}s">◆ ${t}</p>`).join('')}</div>`;
    const b=el('button','btn','再玩一次');b.onclick=intro;c.append(b);
    const t0=performance.now();(function f(n){const p=Math.min((n-t0)/1500,1);$('#cnt').textContent=Math.round(score*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(f)})(t0);
    rs($('#flash'),'go');confetti(r>=.7?170:60);
    snd([[523,0,.2],[659,.2,.2],[784,.4,.2],[1047,.6,.7]],'triangle',.2);
    if(r>=.7)setTimeout(()=>confetti(100),1500);
  },1800);
}

/* ===== 金色彩帶 ===== */
function confetti(n){
  const cols=['#FFD700','#E63946','#fff','#FFB703','#2ECC71'];
  for(let i=0;i<n;i++){const d=el('div','cf'),w=6+Math.random()*8;
    d.style.cssText=`left:${Math.random()*100}vw;width:${w}px;height:${w*1.6}px;background:${cols[i%5]};animation-duration:${1.8+Math.random()*2}s;animation-delay:${Math.random()*.5}s;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.append(d);setTimeout(()=>d.remove(),4800)}
}
intro();
</script>
